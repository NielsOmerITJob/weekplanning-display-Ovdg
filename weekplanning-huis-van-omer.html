<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="300">
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:10px;overflow:hidden;zoom:1.25;}
h1{color:#003b5c;margin:0 0 3px 0;font-size:26px;}
.update{font-size:10px;color:#666;margin-bottom:8px;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.day{background:white;border-radius:10px;padding:7px;box-shadow:0 1px 5px rgba(0,0,0,.10);overflow:hidden;}
.day h2{margin:0 0 6px 0;background:#f7630c;color:white;padding:6px;border-radius:7px;font-size:15px;}
.card{border-left:4px solid #f7630c;background:#fafafa;margin-bottom:6px;padding:5px 6px;border-radius:5px;font-size:10px;line-height:1.15;}
.name{font-weight:bold;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.meta{color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.card div:last-child{margin-bottom:0;}
</style>
</head>
<body>
<h1>Weekplanning interim - Huis van Omer - Week 31</h1>
<div class="update">Laatste vernieuwing: 28/07/2026 05:00</div>
<div class="grid"><div class="day"><h2>Maandag</h2></div><div class="day"><h2>Dinsdag</h2></div><div class="day"><h2>Woensdag</h2></div><div class="day"><h2>Donderdag</h2></div><div class="day"><h2>Vrijdag</h2></div><div class="day"><h2>Zaterdag</h2></div><div class="day"><h2>Zondag</h2></div></div></body></html>
